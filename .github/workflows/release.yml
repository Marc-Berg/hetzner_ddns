name: Build and Release Packages

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'

jobs:
  build-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip ruby ruby-dev build-essential xz-utils
          sudo gem install --no-document fpm

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${VERSION%%-*}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BASE_VERSION=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package staging directories
        run: |
          WORKDIR="$(mktemp -d)"
          COMMON="$WORKDIR/common"
          ALPINE_MAIN="$WORKDIR/alpine-main"
          ALPINE_DOC="$WORKDIR/alpine-doc"
          ALPINE_OPENRC="$WORKDIR/alpine-openrc"

          mkdir -p "$COMMON/usr/bin" "$COMMON/etc" "$COMMON/etc/systemd/system"
          mkdir -p "$ALPINE_MAIN/usr/bin" "$ALPINE_MAIN/etc"
          mkdir -p "$ALPINE_DOC/usr/share/man/man1"
          mkdir -p "$ALPINE_OPENRC/etc/init.d"

          install -m 0755 hetzner_ddns.sh "$COMMON/usr/bin/hetzner_ddns"
          install -m 0755 hetzner_ddns.sh "$ALPINE_MAIN/usr/bin/hetzner_ddns"
          install -m 0640 hetzner_ddns.json "$COMMON/etc/hetzner_ddns.json"
          install -m 0644 hetzner_ddns.json "$COMMON/etc/hetzner_ddns.json.sample"
          install -m 0640 hetzner_ddns.json "$ALPINE_MAIN/etc/hetzner_ddns.json"
          install -m 0644 hetzner_ddns.json "$ALPINE_MAIN/etc/hetzner_ddns.json.sample"

          cp hetzner_ddns.service "$COMMON/etc/systemd/system/hetzner_ddns.service"
          sed -i "s|/usr/local/bin/hetzner_ddns|/usr/bin/hetzner_ddns|" "$COMMON/etc/systemd/system/hetzner_ddns.service"
          sed -i "s|/usr/local/etc/hetzner_ddns.json|/etc/hetzner_ddns.json|" "$COMMON/etc/systemd/system/hetzner_ddns.service"

          gzip -c hetzner_ddns.1.man > "$ALPINE_DOC/usr/share/man/man1/hetzner_ddns.1.gz"
          install -m 0755 hetzner_ddns.init "$ALPINE_OPENRC/etc/init.d/hetzner_ddns"

          echo "WORKDIR=$WORKDIR" >> "$GITHUB_ENV"

      - name: Build Debian package
        run: |
          set -eux
          fpm -s dir -t deb -n hetzner_ddns -v "${{ steps.version.outputs.BASE_VERSION }}" --iteration 1 -a all \
            -d curl -d jq -d net-tools \
            --config-files /etc/hetzner_ddns.json \
            -C "$WORKDIR/common" -p "hetzner_ddns-${{ steps.version.outputs.BASE_VERSION }}-debian.deb" .

      - name: Build RedHat package
        run: |
          set -eux
          fpm -s dir -t rpm -n hetzner_ddns -v "${{ steps.version.outputs.BASE_VERSION }}" --iteration 1 -a noarch \
            -d curl -d jq -d net-tools \
            --config-files /etc/hetzner_ddns.json \
            -C "$WORKDIR/common" -p "hetzner_ddns-${{ steps.version.outputs.BASE_VERSION }}-1-redhat.noarch.rpm" .

      - name: Build ArchLinux package
        continue-on-error: true
        run: |
          set -eux
          ARCH_OUT_DIR="$RUNNER_TEMP/archpkg"
          mkdir -p "$ARCH_OUT_DIR"
          fpm -s dir -t pacman -n hetzner_ddns -v "${{ steps.version.outputs.BASE_VERSION }}" --iteration 1 -a any \
            --pacman-compression xz \
            -d awk -d curl -d jq -d net-tools \
            -C "$WORKDIR/common" -p "$ARCH_OUT_DIR" .
          ARCH_PATH="$(find "$ARCH_OUT_DIR" -type f -name '*.pkg.tar.*' | head -n 1)"
          if [ -z "$ARCH_PATH" ]; then
            echo "Warning: ArchLinux artifact not found"
            exit 0
          fi
          cp "$ARCH_PATH" "hetzner_ddns-${{ steps.version.outputs.BASE_VERSION }}-1-archlinux.pkg.tar.xz"

      - name: Build Alpine main package
        run: |
          set -eux
          fpm -s dir -t apk -n hetzner_ddns -v "${{ steps.version.outputs.BASE_VERSION }}" --iteration 1 -a noarch \
            -d curl -d jq -d net-tools \
            --config-files /etc/hetzner_ddns.json \
            -C "$WORKDIR/alpine-main" -p "hetzner_ddns-${{ steps.version.outputs.BASE_VERSION }}-alpinelinux.apk" .

      - name: Build Alpine doc package
        run: |
          set -eux
          fpm -s dir -t apk -n hetzner_ddns-doc -v "${{ steps.version.outputs.BASE_VERSION }}" --iteration 1 -a noarch \
            -d man-db \
            -C "$WORKDIR/alpine-doc" -p "hetzner_ddns-doc-${{ steps.version.outputs.BASE_VERSION }}-alpinelinux.apk" .

      - name: Build Alpine openrc package
        run: |
          set -eux
          fpm -s dir -t apk -n hetzner_ddns-openrc -v "${{ steps.version.outputs.BASE_VERSION }}" --iteration 1 -a noarch \
            -d openrc -d hetzner_ddns \
            -C "$WORKDIR/alpine-openrc" -p "hetzner_ddns-openrc-${{ steps.version.outputs.BASE_VERSION }}-alpinelinux.apk" .

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            *.deb
            *.rpm
            *.pkg.tar.xz
            *.apk
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-packages
    if: always()

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
        continue-on-error: true

      - name: Cleanup legacy release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          RELEASE_JSON="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/releases/tags/${TAG}" || true)"

          if [ -z "$RELEASE_JSON" ]; then
            echo "No existing release for tag ${TAG}; skipping legacy cleanup"
            exit 0
          fi

          printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("^hetzner-ddns_.*ipv6-monitor_")) | "\(.id) \(.name)"' |
          while IFS=' ' read -r id name; do
            if [ -z "$id" ]; then
              continue
            fi
            echo "Deleting legacy asset: ${name} (id=${id})"
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/releases/assets/${id}" >/dev/null
          done

      - name: Upload assets to release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          artifacts: dist/packages/*
          allowUpdates: true
          removeArtifacts: true
